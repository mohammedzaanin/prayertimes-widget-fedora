name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release version
        run: ./scripts/validate.sh "${GITHUB_REF_NAME}"

      - name: Build Plasma widget
        run: ./package.sh

      - name: Create checksum
        run: sha256sum prayertimes-widget.plasmoid > prayertimes-widget.plasmoid.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          prayertimes-widget.plasmoid
          prayertimes-widget.plasmoid.sha256
          --verify-tag
          --generate-notes
          --title "Prayer Times ${GITHUB_REF_NAME}"
