name: Check package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Plasma widget
        run: ./package.sh

      - name: Inspect package contents
        run: unzip -l prayertimes-widget.plasmoid

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayertimes-widget
          path: prayertimes-widget.plasmoid
          if-no-files-found: error
